<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الصفحة الرئيسية - Hovana</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #0a1f14 0%, #030a06 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Glassmorphism Header Setup */
        header {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        header img {
            height: 110px;
            filter: drop-shadow(0 0 15px rgba(46, 204, 113, 0.4));
            transition: transform 0.4s ease;
        }

        header img:hover {
            transform: scale(1.05);
        }

        h1 {
            color: #2ecc71;
            font-size: 42px;
            font-weight: 800;
            margin: 25px 0 40px;
            text-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
            letter-spacing: 1px;
        }

        /* Main Grid & Cards */
        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            padding: 0 20px;
            margin-bottom: 50px;
        }

        .box {
            background: rgba(18, 43, 28, 0.55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(46, 204, 113, 0.25);
            border-radius: 20px;
            width: 260px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(46, 204, 113, 0.15), transparent);
            transition: 0.5s;
        }

        .box:hover::before {
            left: 100%;
        }

        .box:hover {
            background-color: #2ecc71;
            color: #030a06;
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(46, 204, 113, 0.35);
            border-color: #2ecc71;
        }

        /* Footer Modernization */
        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            background: rgba(3, 10, 6, 0.8);
            border-top: 1px solid rgba(46, 204, 113, 0.15);
            color: #8fa89b;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <img src="West empire-Photoroom.png" alt="Hovana Logo">
    </header>

    <h1>مرحباً في Hovana</h1>

    <div class="container">
        <div class="box" onclick="location.href='rules-admin.html'">قوانين الإدارة</div>
        <div class="box" onclick="location.href='rules-ministry.html'">قوانين الوزارة</div>
    </div>

    <footer>
        &copy; جميع الحقوق محفوظة لسيرفر Hovana - 2026
    </footer>

</body>

</html>
